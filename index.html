<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply saved theme BEFORE React loads to prevent white flash
      (function () {
        if (localStorage.getItem('inkbloom_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inkbloom is a 100% free platform where upcoming writers publish original books and readers discover fresh voices." />
    <meta name="theme-color" content="#800020" />
    <title>Inkbloom — Where Writers Blossom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
